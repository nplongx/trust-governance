[package]
name = "trust-governance"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Ed25519 trust configuration, approval governance, and signed evidence verification primitives"
repository = "https://github.com/nplongx/trust-governance"
readme = "README.md"
keywords = ["ed25519", "trust", "governance", "approval"]
categories = ["authentication", "cryptography"]

[dependencies]
chrono = { version = "=0.4.45", features = ["serde", "clock"] }
hex = "=0.4.3"
protocol-contracts = { version = "=0.2.0", path = "vendor/protocol-contracts" }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
