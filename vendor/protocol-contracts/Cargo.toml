[package]
name = "protocol-contracts"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Typed, versioned wire contracts, strict parsing, and structural validation"
keywords = ["protocol", "wire-format", "serde", "validation"]
categories = ["encoding", "parser-implementations", "web-programming"]

[dependencies]
chrono = { version = "=0.4.45", features = ["serde", "clock"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
